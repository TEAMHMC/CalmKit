# Deploy: gcloud builds submit --config cloudbuild.yaml --substitutions=_GEMINI_API_KEY="your-key",_GOOGLE_MAPS_API_KEY="your-maps-key"
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hmc-calmkit:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hmc-calmkit:latest'
      - '--build-arg'
      - 'GEMINI_API_KEY=$_GEMINI_API_KEY'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/hmc-calmkit:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/hmc-calmkit:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hmc-calmkit'
      - '--image'
      - 'gcr.io/$PROJECT_ID/hmc-calmkit:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'GOOGLE_MAPS_API_KEY=$_GOOGLE_MAPS_API_KEY'

substitutions:
  _GEMINI_API_KEY: ''
  _GOOGLE_MAPS_API_KEY: ''

images:
  - 'gcr.io/$PROJECT_ID/hmc-calmkit:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/hmc-calmkit:latest'
