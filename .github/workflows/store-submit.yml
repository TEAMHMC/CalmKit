name: Submit to App Store and Play Store

on:
  workflow_dispatch: # Manual trigger — run once developer secrets are configured

jobs:
  # ── iOS App Store ─────────────────────────────────────────────────────────
  ios:
    name: Build and submit iOS to App Store
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build web app
        run: npm install && npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Sync Capacitor to iOS
        run: npx cap sync ios

      - name: Install Ruby gems (Fastlane)
        run: bundle install

      - name: Install pods
        working-directory: ios/App
        run: pod install

      - name: Set up App Store Connect API key
        run: |
          mkdir -p fastlane
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > fastlane/AuthKey.p8
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

      - name: Submit to App Store
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: fastlane/AuthKey.p8
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios release

  # ── Google Play Store ──────────────────────────────────────────────────────
  android:
    name: Build and submit Android to Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web app
        run: npm install && npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Set up Android signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/calmkit-release.keystore

      - name: Set up Google Play service account key
        run: |
          echo "${{ secrets.GOOGLE_PLAY_JSON_KEY_CONTENT }}" > fastlane/google-play-key.json

      - name: Install Ruby gems (Fastlane)
        run: bundle install

      - name: Submit to Play Store (internal track)
        env:
          ANDROID_KEYSTORE_PATH: android/calmkit-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY: fastlane/google-play-key.json
        run: bundle exec fastlane android release
